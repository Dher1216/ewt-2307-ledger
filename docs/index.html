<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10302b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="2307 Ledger"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>2307 Ledger</title>
<style>
:root{--ink:#10302b;--ink2:#1b4a42;--brass:#b98a3e;--mist:#e8eeeb;--line:#cfd9d4;--txt:#16241f}
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',sans-serif;color:var(--txt);background:var(--mist)}
#app{display:flex;height:100vh}
nav{width:210px;background:var(--ink);color:#d8e6e0;padding:22px 0;display:flex;flex-direction:column}
nav h1{font:700 22px Georgia,serif;color:#fff;margin:0 22px 4px}nav small{margin:0 22px 22px;color:var(--brass);font-size:12px}
nav a{padding:11px 22px;cursor:pointer;border-left:4px solid transparent}nav a:hover{background:var(--ink2)}
nav a.on{background:var(--ink2);border-left-color:var(--brass);color:#fff;font-weight:600}
main{flex:1;overflow:auto;padding:26px 34px}
h2{font:700 24px Georgia,serif;margin:0 0 16px;color:var(--ink)}h3{font:700 16px Georgia,serif;margin:22px 0 8px;color:var(--ink)}
.box{background:#fff;border:1px solid var(--line);border-top:3px solid var(--brass);padding:18px;margin-bottom:18px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:12px;color:#4b5f58;margin-bottom:3px}
input,select{width:100%;padding:8px;border:1px solid var(--line);background:#fbfdfc;font:inherit}input:focus,select:focus{outline:2px solid var(--brass)}
button{background:var(--ink);color:#fff;border:0;padding:9px 16px;font:inherit;cursor:pointer;margin:10px 8px 0 0}button:hover{background:var(--ink2)}
button.b{background:var(--brass)}button.x{background:#fff;color:var(--ink);border:1px solid var(--ink)}
table.t{width:100%;border-collapse:collapse;background:#fff}.t th{background:var(--ink);color:#fff;text-align:left;padding:8px;font-weight:600}
.t td{padding:6px 8px;border-bottom:1px solid var(--line)}.r{text-align:right}.t tfoot td{font-weight:700;background:#f1ecdf}
.muted{color:#6b7d76;font-size:12px}a.l{color:var(--ink2);cursor:pointer;text-decoration:underline;margin-right:10px}
#ov{display:none;position:fixed;inset:0;background:#000a;overflow:auto;padding:20px;z-index:9}#ov .bar{text-align:center;margin-bottom:10px}
#ov .pg{background:#fff;width:612pt}
#pa{display:none}
#md{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:center;justify-content:center}#md .m{background:#fff;border-top:4px solid var(--brass);padding:22px 26px;max-width:440px;min-width:300px}#md p{margin:0 0 6px;font-size:15px;line-height:1.5}
/* the printed form */
.f{font:8px Arial,sans-serif;color:#000;width:100%}.f table{width:100%;border-collapse:collapse}
.f td,.f th{border:1px solid #000;padding:1px 3px;vertical-align:middle}.f .h{background:#d9d9d9;font-weight:700;text-align:center}
.f .nb{border:0}.f .v{font-size:11px;padding:3px 5px}.f .n{text-align:right}
.fp{position:relative;width:612pt;height:1008pt;overflow:hidden;background:#fff}.fp img{position:absolute;left:0;top:0;width:612pt;height:1008pt}.fp div{position:absolute;white-space:nowrap;font:11.3pt/12.5pt "Times New Roman",serif;color:#000}
@page{size:8.5in 14in;margin:0}
@media print{#app,#ov{display:none!important}#pa{display:block}body{background:#fff}}

#ov .bar{position:sticky;top:0;z-index:2}
@media(max-width:760px){
 body{font-size:15px}#app{flex-direction:column-reverse;height:100dvh}
 nav{width:100%;flex-direction:row;padding:0 0 env(safe-area-inset-bottom);overflow-x:auto;flex:none}
 nav h1,nav small{display:none}nav a{flex:1;white-space:nowrap;text-align:center;padding:14px 12px;border-left:0;border-top:3px solid transparent}nav a.on{border-top-color:var(--brass)}
 main{padding:16px 14px;padding-top:calc(16px + env(safe-area-inset-top))}h2{font-size:20px}
 input,select{font-size:16px}button{padding:11px 16px}
 main table.t{display:block;overflow-x:auto;white-space:nowrap}.t input{min-width:120px}.t td.muted{white-space:normal;min-width:180px}
 #ov{padding:8px}
}
</style></head><body>

 const end=v=>{m.style.display='none';y.onclick=n.onclick=null;res(v)};y.onclick=()=>end(true);n.onclick=()=>end(false);y.focus()})}

const atcMap=()=>{const m={};BASE.forEach(a=>m[a[0]]={code:a[0],desc:a[1],rate:a[2]});live(db.atcs).forEach(a=>m[a.code]={code:a.code,desc:a.desc,rate:+a.rate});return m};
const pl=p=>p?(p.nick?p.nick+' – '+p.name:p.name):'';
const by=(k,id)=>db[k].find(x=>x.id===id);
function calc(l,pe){const a=atcMap()[(l.atc||'').trim().toUpperCase()],g=+l.gross||0,net=R2(pe&&pe.vat!=='no'?g/1.12:g);return{a,net,tax:a?R2(net*a.rate/100):0}}

let E={};
function vEnt(k){const sp=SPEC[k],rows=live(db[k]).filter(x=>k==='payors'||!E.fp||x.payorId===E.fp);
 const fld=([f,l,t])=>t==='payor'?`<div><label>${l}</label><select id="e_${f}">${live(db.payors).map(p=>`<option value="${p.id}" ${E.d?.[f]===p.id?'selected':''}>${esc(pl(p))}</option>`).join('')}</select></div>`
 :t==='vat'?`<div><label>${l}</label><select id="e_${f}"><option value="yes">VAT-registered (amount ÷ 1.12)</option><option value="no" ${E.d?.[f]==='no'?'selected':''}>Non-VAT (no VAT removed)</option></select></div>`
 :`<div><label>${l}</label><input id="e_${f}" value="${esc(E.d?.[f])}"></div>`;
 main.innerHTML=`<h2>${k==='payors'?'Payors':'Payees'}</h2><div class="box"><div class="g">${sp.map(fld).join('')}</div>
 <button class="b" onclick="saveEnt('${k}')">${E.d?.id?'Update':'Save'} ${k==='payors'?'payor':'payee'}</button><button class="x" onclick="E={};vEnt('${k}')">Clear</button></div>
 ${k==='payees'?`<div class="box"><label>Show payees of</label><select onchange="E.fp=this.value;vEnt('payees')"><option value="">All payors</option>${live(db.payors).map(p=>`<option value="${p.id}" ${E.fp===p.id?'selected':''}>${esc(pl(p))}</option>`).join('')}</select></div>`:''}
 <table class="t"><tr><th>Name</th><th>TIN</th><th>${k==='payors'?'Signatory':'Payor / VAT'}</th><th></th></tr>${rows.map(x=>`<tr><td>${k==='payors'?esc(pl(x)):esc(x.name)}</td><td>${esc(x.tin)}</td><td>${k==='payors'?esc(x.sigName):esc(pl(by('payors',x.payorId)))+' / '+(x.vat==='no'?'Non-VAT':'VAT')}</td>
 <td class="r"><a class="l" onclick="E.d=by('${k}','${x.id}');vEnt('${k}')">Edit</a><a class="l" onclick="delEnt('${k}','${x.id}')">Delete</a></td></tr>`).join('')||'<tr><td colspan=4 class="muted">Nothing saved yet. Fill in the form above and save.</td></tr>'}</table>`}
function saveEnt(k){const o=E.d?.id?E.d:{id:uid()};SPEC[k].forEach(([f])=>o[f]=$('#e_'+f)?.value.trim()||'');
 if(!o.name)return note('Enter the registered name.');if(k==='payees'&&!o.payorId)return note('Add a payor first.');
 o.updated=Date.now();if(!db[k].includes(o)&&!by(k,o.id))db[k].push(o);save();E={fp:E.fp};vEnt(k)}
async function delEnt(k,id){if(!await ask('Delete this record?'))return;const o=by(k,id);o.deleted=true;o.updated=Date.now();save();vEnt(k)}
